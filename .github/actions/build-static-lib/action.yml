name: 'Build Static Library'
description: 'Clones or downloads a library and builds it with CMake'

inputs:
  name: { required: true }
  repo: { required: false }
  tag: { required: false }
  c3l: { required: true }
  cmake_flags: { required: false, default: "" }
  src_path: { required: false, default: "." }
  # Downloadable Binary Options
  linux_url: { required: false }
  linux_lib: { required: false }
  mac_url: { required: false }
  mac_lib: { required: false }
  mac_x64_url: { required: false }
  mac_x64_lib: { required: false }
  win_url: { required: false }
  win_lib: { required: false }
  os: { required: true }
  # Post-Processing Options
  after_build: { required: false, default: "" }

runs:
  using: "composite"
  steps:
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
          libxrandr-dev libwayland-dev libxkbcommon-dev wayland-protocols libgl1-mesa-dev \
          libglu1-mesa-dev libxext-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev \
          libpulse-dev libjack-dev libsndio-dev mesa-common-dev xorg-dev libxkbcommon-x11-dev

    - name: Build and Package
      shell: bash
      env:
        HOOK_SCRIPT: ${{ inputs.after_build }}
      run: |
        set -x
        if [ "${{ runner.os }}" == "Windows" ]; then
          TARGET_DIR="windows-x64"
        elif [[ "${{ inputs.os }}" == "macos-latest" ]]; then
          TARGET_DIR="macos-aarch64"
        else
          TARGET_DIR="linux-x64"
        fi

        TARGET_BASE="$GITHUB_WORKSPACE/upload_stage/libraries/${{ inputs.c3l }}"
        mkdir -p "$TARGET_BASE/$TARGET_DIR"
        IS_MAC=0; [[ "${{ inputs.os }}" == "macos-latest" ]] && IS_MAC=1

        run_hook() {
          [ -z "$HOOK_SCRIPT" ] && return
          export TARGET_DIR="$1"
          ( cd "$GITHUB_WORKSPACE" && printf "%s" "$HOOK_SCRIPT" > run_hook.sh && bash run_hook.sh )
        }

        fetch_lib() {
          local url="$1" lib="$2" dest="$3" archive
          archive=$(basename "$url")
          curl -fsSL -o "$archive" "$url"
          mkdir -p "$TARGET_BASE/$dest"
          if [[ "$archive" == *.tar.gz ]]; then
            tar -xzf "$archive" "$lib" && cp "$lib" "$TARGET_BASE/$dest/"
          else
            unzip -j "$archive" "$lib" -d "$TARGET_BASE/$dest/"
          fi
        }

        # Handle pre-compiled binaries if URLs are provided
        if [ "${{ runner.os }}" == "Windows" ]; then
          BIN_URL="${{ inputs.win_url }}"; BIN_LIB="${{ inputs.win_lib }}"
        elif [ "$IS_MAC" = 1 ]; then
          BIN_URL="${{ inputs.mac_url }}"; BIN_LIB="${{ inputs.mac_lib }}"
        else
          BIN_URL="${{ inputs.linux_url }}"; BIN_LIB="${{ inputs.linux_lib }}"
        fi

        if [ -n "$BIN_URL" ] && [ -n "$BIN_LIB" ]; then
          fetch_lib "$BIN_URL" "$BIN_LIB" "$TARGET_DIR"
          if [ "$IS_MAC" = 1 ]; then
            if [ -n "${{ inputs.mac_x64_url }}" ]; then
              fetch_lib "${{ inputs.mac_x64_url }}" "${{ inputs.mac_x64_lib }}" "macos-x64"
            else
              mkdir -p "$TARGET_BASE/macos-x64"
              cp "$TARGET_BASE/$TARGET_DIR/$(basename "$BIN_LIB")" "$TARGET_BASE/macos-x64/"
            fi
          fi
          run_hook "$TARGET_DIR"
        else
          # Otherwise build from source
          git clone ${{ inputs.repo }} -b ${{ inputs.tag }} build_src
          cd build_src
          git submodule update --init --recursive

          build_one() {
            local dest="$1" arch="${2:-}" flags
            flags="${{ inputs.cmake_flags }}"
            # Point dependent builds (sdl3_image/ttf) at the matching arch install
            flags="${flags//sdl3_install/sdl3_install/$dest}"
            rm -rf c3_build_temp && mkdir c3_build_temp && cd c3_build_temp
            if [ -n "$arch" ]; then
              cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$arch" $flags "../${{ inputs.src_path }}"
            else
              cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release $flags "../${{ inputs.src_path }}"
            fi
            cmake --build . --config Release --parallel 4
            mkdir -p "$TARGET_BASE/$dest"
            find . -type f \( -name "*.a" -o -name "*.lib" \) -exec cp {} "$TARGET_BASE/$dest/" \;
            cd ..
            run_hook "$dest"
          }

          if [ "$IS_MAC" = 1 ]; then
            build_one macos-aarch64 arm64
            build_one macos-x64 x86_64
          else
            build_one "$TARGET_DIR"
          fi
          cd ..
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}-statics-${{ inputs.os }}
        path: upload_stage/
