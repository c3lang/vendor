name: 'Build Static Library'
description: 'Clones or downloads a library and builds it with CMake'

inputs:
  name: { required: true }
  repo: { required: false }
  tag: { required: false }
  c3l: { required: true }
  cmake_flags: { required: false, default: "" }
  src_path: { required: false, default: "." }
  # C3 target folder, e.g. linux-x64, macos-aarch64, windows-x64
  target: { required: true }
  # Optional prebuilt binary for this exact target
  bin_url: { required: false }
  bin_lib: { required: false }
  # macOS cross-compile / lipo thinning (e.g. x86_64 or arm64)
  cmake_osx_arch: { required: false, default: "" }
  lipo_arch: { required: false, default: "" }
  # Post-Processing Options
  after_build: { required: false, default: "" }

runs:
  using: "composite"
  steps:
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxinerama-dev \
          libxrandr-dev libwayland-dev libxkbcommon-dev wayland-protocols libgl1-mesa-dev \
          libglu1-mesa-dev libxext-dev libxfixes-dev libxss-dev libxtst-dev libasound2-dev \
          libpulse-dev libjack-dev libsndio-dev mesa-common-dev xorg-dev libxkbcommon-x11-dev

    - name: Build and Package
      shell: bash
      env:
        HOOK_SCRIPT: ${{ inputs.after_build }}
      run: |
        set -x
        TARGET_DIR="${{ inputs.target }}"
        TARGET_BASE="upload_stage/libraries/${{ inputs.c3l }}"
        mkdir -p "$TARGET_BASE/$TARGET_DIR"

        BIN_URL="${{ inputs.bin_url }}"
        BIN_LIB="${{ inputs.bin_lib }}"
        CMAKE_OSX_ARCH="${{ inputs.cmake_osx_arch }}"
        LIPO_ARCH="${{ inputs.lipo_arch }}"

        if [ -n "$BIN_URL" ] && [ -n "$BIN_LIB" ]; then
          ARCHIVE=$(basename "$BIN_URL")
          curl -fsSL -o "$ARCHIVE" "$BIN_URL"
          if [[ "$ARCHIVE" == *.tar.gz ]]; then
            tar -xzf "$ARCHIVE" "$BIN_LIB"
            cp "$BIN_LIB" "$TARGET_BASE/$TARGET_DIR/"
            DEST="$TARGET_BASE/$TARGET_DIR/$(basename "$BIN_LIB")"
          else
            unzip -j "$ARCHIVE" "$BIN_LIB" -d "$TARGET_BASE/$TARGET_DIR/"
            DEST="$TARGET_BASE/$TARGET_DIR/$(basename "$BIN_LIB")"
          fi

          if [ -n "$LIPO_ARCH" ] && [ -f "$DEST" ]; then
            ARCHES=$(lipo -archs "$DEST" 2>/dev/null || true)
            if [ -n "$ARCHES" ]; then
              if ! echo " $ARCHES " | grep -q " $LIPO_ARCH "; then
                echo "ERROR: $DEST does not contain architecture $LIPO_ARCH (has: $ARCHES)"
                exit 1
              fi
              COUNT=$(echo "$ARCHES" | wc -w | tr -d ' ')
              if [ "$COUNT" -gt 1 ]; then
                lipo -thin "$LIPO_ARCH" "$DEST" -output "$DEST.thin"
                mv "$DEST.thin" "$DEST"
              fi
            fi
          fi
        else
          # Otherwise build from source
          git clone ${{ inputs.repo }} -b ${{ inputs.tag }} build_src
          cd build_src
          git submodule update --init --recursive
          mkdir -p c3_build_temp && cd c3_build_temp

          OSX_ARCH_FLAG=""
          if [ -n "$CMAKE_OSX_ARCH" ]; then
            OSX_ARCH_FLAG="-DCMAKE_OSX_ARCHITECTURES=$CMAKE_OSX_ARCH"
          fi

          cmake -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release $OSX_ARCH_FLAG ${{ inputs.cmake_flags }} "../${{ inputs.src_path }}"
          cmake --build . --config Release --parallel 4

          find . -type f \( -name "*.a" -o -name "*.lib" \) -exec cp {} "../../$TARGET_BASE/$TARGET_DIR/" \;
          cd ../..
        fi

        # After Build Hook
        if [ -n "$HOOK_SCRIPT" ]; then
           printf "%s" "$HOOK_SCRIPT" > run_hook.sh
           bash run_hook.sh
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.name }}-statics-${{ inputs.target }}
        path: upload_stage/
